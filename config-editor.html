<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Editor — ControlBans</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0e14;--bg-surface:#111720;--bg-elevated:#161e2a;--bg-code:#0d1219;
--border:#1e2838;--border-bright:#2a3850;
--text:#a8b3cf;--text-bright:#e8edf5;--text-dim:#6b7689;
--blue:#4a9eff;--blue-bright:#6db5ff;--blue-glow:rgba(74,158,255,0.12);
--green:#1bd96a;--green-bright:#3deb80;
--purple:#a78bfa;--yellow:#fbbf24;--red:#f87171;
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:500;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased}

/* Nav */
.nav{position:sticky;top:0;z-index:1000;background:rgba(10,14,20,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-brand img{width:26px;height:26px;border-radius:6px}
.nav-brand-name{font-weight:800;font-size:14px;color:var(--text-bright)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:var(--text-dim);text-decoration:none;font-weight:600;font-size:13px;padding:6px 10px;border-radius:6px;transition:all 0.15s}
.nav-link:hover{color:var(--text-bright);background:var(--bg-elevated)}
.nav-link.active{color:var(--blue-bright);background:var(--blue-glow)}
.nav-cta{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#00150a;text-decoration:none;font-weight:700;font-size:12px;padding:5px 10px;border-radius:6px;transition:all 0.15s}
.nav-cta:hover{background:var(--green-bright);transform:translateY(-1px)}
.nav-cta svg{width:14px;height:14px}

/* Layout — top to bottom */
.main{display:flex;flex-direction:column;min-height:calc(100vh - 48px)}
.editor-section{padding:20px;max-width:1400px;margin:0 auto;width:100%}

/* Tabs */
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 18px;background:none;border:none;color:var(--text-dim);font-weight:600;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;transition:all 0.15s;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab:hover{color:var(--text-bright)}
.tab.active{color:var(--blue-bright);border-bottom-color:var(--blue)}

/* Upload */
.upload-zone{border:2px dashed var(--border-bright);border-radius:10px;padding:24px;text-align:center;transition:all 0.2s;cursor:pointer;margin-bottom:16px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--blue);background:var(--blue-glow)}
.upload-zone h3{font-size:14px;font-weight:700;color:var(--text-bright);margin-bottom:4px}
.upload-zone p{font-size:12px;color:var(--text-dim)}
.upload-zone svg{width:28px;height:28px;color:var(--text-dim);margin-bottom:8px}

/* Split: editor + preview side by side */
.split{display:grid;grid-template-columns:1fr 480px;gap:16px;align-items:start}

/* Editor panel */
.editor-panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.editor-scroll{max-height:none;padding:16px}

/* Search */
.locale-search{width:100%;background:var(--bg-code);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text-bright);font-size:13px;font-family:inherit;margin-bottom:12px}
.locale-search:focus{outline:none;border-color:var(--blue)}

/* Locale list */
.locale-section{margin-bottom:20px}
.locale-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--blue-bright);margin-bottom:8px;padding:4px 8px;background:var(--blue-glow);border-radius:4px;display:inline-block}
.locale-item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;transition:all 0.15s}
.locale-item:hover{border-color:var(--border-bright)}
.locale-item.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.locale-item-key{font-size:11px;font-family:'SF Mono','Consolas',monospace;color:var(--text-dim);margin-bottom:4px;font-weight:600;word-break:break-all}
.locale-item-input{width:100%;background:var(--bg-code);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--text-bright);font-size:12px;font-family:'SF Mono','Consolas',monospace;font-weight:500;resize:vertical;min-height:32px;line-height:1.5}
.locale-item-input:focus{outline:none;border-color:var(--blue)}
.locale-item-list-label{font-size:10px;color:var(--text-dim);font-weight:600;margin-top:4px;margin-bottom:2px}

/* Config form */
.config-section{margin-bottom:20px}
.config-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--blue-bright);margin-bottom:8px;padding:4px 8px;background:var(--blue-glow);border-radius:4px;display:inline-block}
.config-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:4px 0}
.config-label{font-size:13px;font-weight:600;color:var(--text);flex-shrink:0;min-width:160px}
.config-input,.config-select{background:var(--bg-code);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text-bright);font-size:13px;font-family:inherit;font-weight:500;flex:1;min-width:0;transition:border-color 0.15s}
.config-input:focus,.config-select:focus{outline:none;border-color:var(--blue)}
.config-select{cursor:pointer}
.config-toggle{position:relative;width:36px;height:20px;background:var(--bg-code);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:background 0.2s;flex-shrink:0}
.config-toggle.on{background:var(--green);border-color:var(--green)}
.config-toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text-bright);border-radius:50%;transition:transform 0.2s}
.config-toggle.on::after{transform:translateX(16px);background:#00150a}

/* Preview panel — sticky on right */
.preview-panel{position:sticky;top:64px}
.preview-header{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px 10px 0 0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.preview-header-title{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em}
.preview-type-btns{display:flex;gap:3px;flex-wrap:wrap}
.preview-type-btn{padding:3px 8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit}
.preview-type-btn:hover{color:var(--text-bright)}
.preview-type-btn.active{background:var(--blue-glow);border-color:var(--blue);color:var(--blue-bright)}

/* Minecraft preview styles */
.mc-container{background:#1a1a2e;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:16px;min-height:400px}
/* Disconnect screen look */
.mc-disconnect{background:rgba(0,0,0,0.75);border-radius:6px;padding:20px 24px;font-family:'SF Mono','Consolas','Courier New',monospace;font-size:13px;line-height:1.8;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:350px}
/* Chat box look */
.mc-chat-box{background:rgba(0,0,0,0.45);border-radius:6px;padding:12px 16px;font-family:'SF Mono','Consolas','Courier New',monospace;font-size:13px;line-height:1.7;min-height:80px}
.mc-chat-line{margin-bottom:3px;word-break:break-word}
/* Action bar look */
.mc-actionbar{font-family:'SF Mono','Consolas','Courier New',monospace;font-size:14px;text-align:center;padding:8px;background:rgba(0,0,0,0.3);border-radius:4px}
/* Staff alert look */
.mc-staff-alert{background:rgba(0,0,0,0.5);border-left:3px solid #fbbf24;border-radius:0 6px 6px 0;padding:10px 14px;font-family:'SF Mono','Consolas','Courier New',monospace;font-size:13px;line-height:1.7}

/* MiniMessage rendered output */
.mm-text{font-family:'SF Mono','Consolas','Courier New',monospace}
.mm-bold{font-weight:bold}
.mm-italic{font-style:italic}
.mm-underlined{text-decoration:underline}
.mm-strikethrough{text-decoration:line-through}
.mm-obfuscated{display:inline-block}

/* Placeholder text */
.mc-placeholder{color:rgba(255,255,255,0.25);font-style:italic;text-align:center;padding:60px 20px;font-size:13px}

/* Export bar */
.export-bar{position:sticky;bottom:0;background:var(--bg-surface);border-top:1px solid var(--border);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center;z-index:10}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-weight:700;font-size:12px;text-decoration:none;transition:all 0.15s;border:none;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--green);color:#00150a}
.btn-primary:hover{background:var(--green-bright);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-elevated);color:var(--text-bright);border:1px solid var(--border-bright)}
.btn-secondary:hover{border-color:var(--blue);color:var(--blue-bright)}
.btn svg{width:14px;height:14px}

/* Status */
.status-msg{padding:7px 12px;border-radius:5px;font-size:12px;font-weight:600;margin-bottom:10px}
.status-msg.success{background:rgba(27,217,106,0.1);color:var(--green);border:1px solid rgba(27,217,106,0.2)}
.status-msg.error{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.status-msg.info{background:var(--blue-glow);color:var(--blue-bright);border:1px solid rgba(74,158,255,0.2)}

.hidden{display:none!important}

/* Responsive */
@media(max-width:1000px){
.split{grid-template-columns:1fr}
.preview-panel{position:relative;top:0}
}
    </style>
</head>

// ============================================================
// MiniMessage Parser
// ============================================================
function renderMiniMessage(text) {
    if (!text) return '';

    let result = text;
    // Replace placeholders
    for (const [key, value] of Object.entries(previewPlaceholders)) {
        result = result.split(key).join(value);
    }

    // Escape HTML
    result = result.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Convert escaped MiniMessage tags back
    result = result.replace(/&lt;\/?([a-zA-Z0-9_#:.\/\- ]+)&gt;/g, '<$1>');

    const colorMap = {
        'black': '#000000', 'dark_blue': '#0000AA', 'dark_green': '#00AA00',
        'dark_aqua': '#00AAAA', 'dark_red': '#AA0000', 'dark_purple': '#AA00AA',
        'gold': '#FFAA00', 'gray': '#AAAAAA', 'dark_gray': '#555555',
        'blue': '#5555FF', 'green': '#55FF55', 'aqua': '#55FFFF',
        'red': '#FF5555', 'light_purple': '#FF55FF', 'yellow': '#FFFF55',
        'white': '#FFFFFF',
    };

    // Gradient
    result = result.replace(/<gradient:([^>]+)>([\s\S]*?)<\/gradient>/gi, (m, colors, content) => {
        const cl = colors.split(':').filter(c => c.trim());
        return `<span style="color:${cl[0] || '#fff'}">${content}</span>`;
    });

    // Hex color pairs
    result = result.replace(/<#([0-9a-fA-F]{6})>([\s\S]*?)<\/#([0-9a-fA-F]{6})>/gi, (m, open, content) => {
        return `<span style="color:#${open}">${content}</span>`;
    });
    // Self-closing hex
    result = result.replace(/<#([0-9a-fA-F]{6})>/gi, (m, hex) => `<span style="color:#${hex}">`);

    // Named colors (with closing tag)
    for (const [name, hex] of Object.entries(colorMap)) {
        const re = new RegExp(`<${name}>([\\s\\S]*?)</${name}>`, 'gi');
        result = result.replace(re, (m, content) => `<span style="color:${hex}">${content}</span>`);
        result = result.replace(new RegExp(`<${name}>`, 'gi'), `<span style="color:${hex}">`);
    }

    // Formatting
    result = result.replace(/<bold>([\s\S]*?)<\/bold>/gi, '<span class="mm-bold">$1</span>');
    result = result.replace(/<b>([\s\S]*?)<\/b>/gi, '<span class="mm-bold">$1</span>');
    result = result.replace(/<bold>/gi, '<span class="mm-bold">');
    result = result.replace(/<italic>([\s\S]*?)<\/italic>/gi, '<span class="mm-italic">$1</span>');
    result = result.replace(/<i>([\s\S]*?)<\/i>/gi, '<span class="mm-italic">$1</span>');
    result = result.replace(/<italic>/gi, '<span class="mm-italic">');
    result = result.replace(/<underlined>([\s\S]*?)<\/underlined>/gi, '<span class="mm-underlined">$1</span>');
    result = result.replace(/<u>([\s\S]*?)<\/u>/gi, '<span class="mm-underlined">$1</span>');
    result = result.replace(/<underlined>/gi, '<span class="mm-underlined">');
    result = result.replace(/<strikethrough>([\s\S]*?)<\/strikethrough>/gi, '<span class="mm-strikethrough">$1</span>');
    result = result.replace(/<st>([\s\S]*?)<\/st>/gi, '<span class="mm-strikethrough">$1</span>');
    result = result.replace(/<strikethrough>/gi, '<span class="mm-strikethrough">');

    // Reset closes all spans
    result = result.replace(/<reset>/gi, '</span>');
    // Close any remaining open spans
    result += '</span>'.repeat(30);

    return result;
}

        {id: 'actionbar', label: 'Action Bar'},
        {id: 'chat-message', label: 'Chat Msg'},
    ];
    typeBtns.innerHTML = allTypes.map(t =>
        `<button class="preview-type-btn ${t.id === activePreview ? 'active' : ''}" data-preview="${t.id}">${t.label}</button>`
    ).join('');
    typeBtns.querySelectorAll('.preview-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activePreview = btn.dataset.preview;
            updatePreview();
        });
    });

    if (activeTab === 'locale' && activeLocaleKey) {
        renderLocalePreview();
    } else if (activeTab === 'config') {
        renderConfigPreview();
    } else {
        container.innerHTML = '<div class="mc-placeholder">Click any message on the left to see a live Minecraft preview here.</div>';
    }
}

function renderLocalePreview() {
    const container = document.getElementById('mc-container');
    const value = localeData[activeLocaleKey];

    if (value === undefined || value === null) {
        container.innerHTML = '<div class="mc-placeholder">No value set for this key.</div>';
        return;
    }

    // If it's a list (like screens.ban), render as multi-line disconnect screen
    if (Array.isArray(value)) {
        const lines = value.map(line => renderMiniMessage(line)).join('<br>');
        if (activePreview.includes('screen')) {
            container.innerHTML = `<div class="mc-disconnect"><div class="mm-text">${lines}</div></div>`;
        } else {
            container.innerHTML = `<div class="mc-chat-box"><div class="mc-chat-line mm-text">${lines}</div></div>`;
        }
        return;
    }

    // Single string
    const rendered = renderMiniMessage(value);

    if (activePreview === 'ban-screen' || activePreview === 'tempban-screen' || activePreview === 'kick-screen' || activePreview === 'mute-screen') {
        container.innerHTML = `<div class="mc-disconnect"><div class="mm-text">${rendered}</div></div>`;
    } else if (activePreview === 'broadcast') {
        container.innerHTML = `<div class="mc-chat-box"><div class="mc-chat-line mm-text">${rendered}</div></div>`;
    } else if (activePreview === 'staff-alert') {
        container.innerHTML = `<div class="mc-staff-alert"><div class="mm-text">${rendered}</div></div>`;
    } else if (activePreview === 'actionbar') {
        container.innerHTML = `<div class="mc-actionbar mm-text">${rendered}</div>`;
    } else {
        container.innerHTML = `<div class="mc-chat-box"><div class="mc-chat-line mm-text">${rendered}</div></div>`;
    }
}

function renderConfigPreview() {
    const container = document.getElementById('mc-container');
    // For config tab, show a sample broadcast using current config settings
    const broadcastEnabled = getNestedValue(configData, 'punishments.broadcast.enabled', true);
    const silentDefault = getNestedValue(configData, 'punishments.silent-by-default', false);
    const lang = configData.language || 'en';

    let html = `<div class="mc-chat-box">
        <div class="mc-chat-line" style="color:#8b949e;font-size:12px;">Config Preview — Language: <span style="color:#6db5ff">${lang}</span></div>
        <div class="mc-chat-line" style="color:#8b949e;font-size:12px;">Broadcast: <span style="color:${broadcastEnabled ? '#1bd96a' : '#f87171'}">${broadcastEnabled ? 'enabled' : 'disabled'}</span> · Silent default: <span style="color:${silentDefault ? '#fbbf24' : '#8b949e'}">${silentDefault ? 'yes' : 'no'}</span></div>
        <div class="mc-chat-line" style="margin-top:8px;">`;

    if (broadcastEnabled) {
        html += `<span class="mm-text">${renderMiniMessage(DEFAULT_LOCALE['broadcasts.ban'])}</span>`;
    } else {
        html += `<span style="color:#6b7689">Broadcasts are disabled in config.</span>`;
    }

    html += `</div></div>`;
    container.innerHTML = html;
}

// ============================================================
// Locale list rendering
// ============================================================
function renderLocaleList(filter = '') {
    const listEl = document.getElementById('locale-list');
    const allKeys = Object.keys(DEFAULT_LOCALE);

    // Group by section
    const sections = {};
    for (const key of allKeys) {
        const section = key.split('.')[0];
        if (!sections[section]) sections[section] = [];
        sections[section].push(key);
    }

    let html = '';
    for (const [section, keys] of Object.entries(sections)) {
        const filtered = keys.filter(key => {
            if (!filter) return true;
            const val = localeData[key] || DEFAULT_LOCALE[key] || '';
            return key.toLowerCase().includes(filter.toLowerCase()) ||
                   (typeof val === 'string' && val.toLowerCase().includes(filter.toLowerCase()));
        });
        if (filtered.length === 0) continue;

        html += `<div class="locale-section">`;
        html += `<div class="locale-section-title">${section} (${filtered.length})</div>`;

        for (const key of filtered) {
            const value = localeData[key] !== undefined ? localeData[key] : DEFAULT_LOCALE[key];
            const isActive = key === activeLocaleKey;

            if (Array.isArray(value)) {
                // List value (like screens.ban)
                html += `<div class="locale-item ${isActive ? 'active' : ''}" data-key="${key}">`;
                html += `<div class="locale-item-key">${key} <span style="color:var(--text-dim);font-weight:400">(${value.length} lines)</span></div>`;
                value.forEach((line, i) => {
                    const escaped = String(line).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    html += `<div class="locale-item-list-label">Line ${i + 1}</div>`;
                    html += `<textarea class="locale-item-input" data-key="${key}" data-index="${i}" rows="1">${escaped}</textarea>`;
                });
                html += `</div>`;
            } else {
                const escaped = String(value).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                html += `<div class="locale-item ${isActive ? 'active' : ''}" data-key="${key}">`;
                html += `<div class="locale-item-key">${key}</div>`;
                html += `<textarea class="locale-item-input" data-key="${key}" rows="2">${escaped}</textarea>`;
                html += `</div>`;
            }
        }
        html += `</div>`;
    }

    if (!html) {
        listEl.innerHTML = '<div class="mc-placeholder">No messages found.</div>';
        return;
    }

    listEl.innerHTML = html;

    // Attach listeners
    listEl.querySelectorAll('.locale-item').forEach(item => {
        const key = item.dataset.key;
        item.addEventListener('click', (e) => {
            if (e.target.tagName !== 'TEXTAREA') {
                activeLocaleKey = key;
                // Auto-set preview type based on key
                const ptype = PREVIEW_MAP[key] || 'chat-message';
                activePreview = ptype;
                updatePreview();
                // Update active styling
                listEl.querySelectorAll('.locale-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            }
        });
    });

    listEl.querySelectorAll('.locale-item-input').forEach(input => {
        const key = input.dataset.key;
        const index = input.dataset.index;

        input.addEventListener('focus', () => {
            activeLocaleKey = key;
            const ptype = PREVIEW_MAP[key] || 'chat-message';
            activePreview = ptype;
            updatePreview();
            listEl.querySelectorAll('.locale-item').forEach(i => i.classList.remove('active'));
            input.closest('.locale-item').classList.add('active');
        });

        input.addEventListener('input', () => {
            let val = input.value.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
            if (index !== undefined) {
                // List item
                if (!Array.isArray(localeData[key])) {
                    localeData[key] = [...(DEFAULT_LOCALE[key] || [])];
                }
                localeData[key][parseInt(index)] = val;
            } else {
                localeData[key] = val;
            }
            if (activeLocaleKey === key) renderLocalePreview();
        });
    });
}

// ============================================================
// Config form rendering
// ============================================================
function setNestedValue(obj, path, value) {
    const keys = path.split('.');
    let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) {
        if (!cur[keys[i]]) cur[keys[i]] = {};
        cur = cur[keys[i]];
    }
    cur[keys[keys.length - 1]] = value;
}

function getNestedValue(obj, path, def) {
    const keys = path.split('.');
    let cur = obj;
    for (const k of keys) {
        if (cur[k] === undefined) return def;
        cur = cur[k];
    }
    return cur;
}

// ============================================================
// File upload
// ============================================================
function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const parsed = jsyaml.load(e.target.result);
            if (!parsed) throw new Error('Empty file');

            if (parsed.database || parsed.punishments || parsed.escalation || parsed.templates) {
                configData = parsed;
                showStatus('config.yml loaded! Edit settings on the left.', 'success');
                renderConfigForm();
                switchTab('config');
            } else if (parsed.errors || parsed.success || parsed.broadcasts || parsed.prefix || parsed.screens) {
                // Locale file — merge with defaults
                localeData = {...DEFAULT_LOCALE, ...flattenYaml(parsed)};
                showStatus('Locale file loaded! Edit messages on the left.', 'success');
                renderLocaleList();
                switchTab('locale');
            } else {
                showStatus('Unrecognized file. Expected config.yml or a locale .yml file.', 'error');
            }
        } catch (err) {
            showStatus('YAML parse error: ' + err.message, 'error');
        }
    };
    reader.readAsText(file);
}

function flattenYaml(obj, prefix = '') {
    const result = {};
    for (const [k, v] of Object.entries(obj)) {
        const full = prefix ? `${prefix}.${k}` : k;
        if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
            Object.assign(result, flattenYaml(v, full));
        } else {
            result[full] = v;
        }
    }
    return result;
}

function showStatus(msg, type = 'info') {
    const el = document.getElementById('status-area');
    el.innerHTML = `<div class="status-msg ${type}">${msg}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 5000);
}

// ============================================================
// Export
// ============================================================
function exportYaml() {
    if (activeTab === 'config') {
        return jsyaml.dump(configData, { lineWidth: -1, quotingType: '"', noRefs: true });
    } else {
        // Rebuild nested structure from flat locale data
        const nested = {};
        for (const [key, val] of Object.entries(localeData)) {
            const parts = key.split('.');
            let cur = nested;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!cur[parts[i]]) cur[parts[i]] = {};
                cur = cur[parts[i]];
            }
            cur[parts[parts.length - 1]] = val;
        }
        return jsyaml.dump(nested, { lineWidth: -1, quotingType: '"', noRefs: true });
    }
}

// ============================================================
// Tab switching
// ============================================================
function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('locale-tab').classList.toggle('hidden', tab !== 'locale');
    document.getElementById('config-tab').classList.toggle('hidden', tab !== 'config');
    updatePreview();
}

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    renderLocaleList();
    renderConfigForm();

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    uploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    document.getElementById('locale-search').addEventListener('input', (e) => renderLocaleList(e.target.value));

    document.getElementById('btn-copy').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(exportYaml());
            showStatus('YAML copied to clipboard!', 'success');
        } catch (err) {
            showStatus('Failed to copy. Try Download instead.', 'error');
        }
    });

    document.getElementById('btn-download').addEventListener('click', () => {
        const yaml = exportYaml();
        const filename = activeTab === 'config' ? 'config.yml' : 'en.yml';
        const blob = new Blob([yaml], { type: 'text/yaml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        showStatus(`Downloaded ${filename}!`, 'success');
    });

    updatePreview();
});
</script>
